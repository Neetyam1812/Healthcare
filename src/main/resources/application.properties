spring.application.name=demo

# PostgreSQL Database Connection (HealthCare Database)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/HealthCare}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1812}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.pool-name=HealthCareHikariPool

# Session & Cookie Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Settings
spring.flyway.enabled=false

# Thymeleaf Template Engine Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=true

# Actuator Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

