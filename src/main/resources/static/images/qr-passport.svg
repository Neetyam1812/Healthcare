  <rect x="112" y="44" width="8" height="8" rx="1" fill="#334155"/>
  <rect x="28" y="80" width="8" height="8" rx="1" fill="#334155"/>
  <rect x="44" y="80" width="8" height="8" rx="1" fill="#334155"/>
  <rect x="28" y="96" width="8" height="8" rx="1" fill="#334155"/>
  <rect x="44" y="112" width="8" height="8" rx="1" fill="#334155"/>
  <rect x="148" y="80" width="8" height="8" rx="1" fill="#334155"/>
  <rect x="164" y="96" width="8" height="8" rx="1" fill="#334155"/>
  <rect x="148" y="112" width="8" height="8" rx="1" fill="#334155"/>
  <rect x="80" y="148" width="8" height="8" rx="1" fill="#334155"/>
  <rect x="96" y="164" width="8" height="8" rx="1" fill="#334155"/>
  <rect x="112" y="148" width="8" height="8" rx="1" fill="#334155"/>
