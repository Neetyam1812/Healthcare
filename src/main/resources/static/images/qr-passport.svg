<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none" role="img" aria-label="Emergency QR Medical Passport">
  <rect width="200" height="200" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <!-- Corner QR pattern 1 -->
  <rect x="24" y="24" width="44" height="44" rx="6" fill="#0F172A"/>
  <rect x="32" y="32" width="28" height="28" rx="3" fill="#FFFFFF"/>
  <rect x="38" y="38" width="16" height="16" rx="2" fill="#2563EB"/>

  <!-- Corner QR pattern 2 -->
  <rect x="132" y="24" width="44" height="44" rx="6" fill="#0F172A"/>
  <rect x="140" y="32" width="28" height="28" rx="3" fill="#FFFFFF"/>
  <rect x="146" y="38" width="16" height="16" rx="2" fill="#2563EB"/>

  <!-- Corner QR pattern 3 -->
  <rect x="24" y="132" width="44" height="44" rx="6" fill="#0F172A"/>
  <rect x="32" y="140" width="28" height="28" rx="3" fill="#FFFFFF"/>
  <rect x="38" y="146" width="16" height="16" rx="2" fill="#2563EB"/>

  <!-- Middle emergency medical cross -->
  <circle cx="100" cy="100" r="28" fill="#0D9488"/>
  <path d="M100 86v28M86 100h28" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

  <!-- Data modules -->
