<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="adminHead(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${title != null ? title + ' | FamilyCare Admin' : 'Admin Portal | FamilyCare'}">Admin Portal | FamilyCare</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Inline No-Flash Theme Script -->
  <script>
    (function() {
      try {
        var t = localStorage.getItem('familycare-theme');
        if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <!-- Stylesheets -->
  <link rel="stylesheet" th:href="@{/css/theme.css}">
  <link rel="stylesheet" th:href="@{/css/admin.css}">

  <!-- CSRF Meta Tags for AJAX Requests -->
  <meta th:name="_csrf" th:content="${_csrf.token}" th:if="${_csrf != null}"/>
  <meta th:name="_csrf_header" th:content="${_csrf.headerName}" th:if="${_csrf != null}"/>
</head>

<body th:fragment="shell(title, active, content)">
  <div class="admin-layout">
    <!-- Desktop Admin Sidebar (260px) -->
    <aside class="admin-sidebar" aria-label="Administrative Navigation">
      <div class="admin-sidebar-header">
        <a th:href="@{/admin/dashboard}" class="admin-brand" aria-label="FamilyCare Admin Home">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          <span>FamilyCare</span>
        </a>
        <span class="admin-chip">Admin</span>
      </div>

      <nav class="admin-nav" aria-label="Admin Navigation Links">
        <!-- 1. Dashboard -->
        <a th:href="@{/admin/dashboard}" class="admin-nav-item" th:classappend="${active == 'dashboard'} ? 'active' : ''">
          <span class="admin-nav-content">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="3" y="3" width="7" height="7" rx="1"/>
              <rect x="14" y="3" width="7" height="7" rx="1"/>
              <rect x="14" y="14" width="7" height="7" rx="1"/>
              <rect x="3" y="14" width="7" height="7" rx="1"/>
            </svg>
            <span>Dashboard</span>
          </span>
        </a>

        <!-- 2. Users -->
        <a th:href="@{/admin/users}" class="admin-nav-item" th:classappend="${active == 'users'} ? 'active' : ''">
          <span class="admin-nav-content">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            <span>Users</span>
          </span>
        </a>

        <!-- 3. Audit Log (SUPER_ADMIN and ANALYST only) -->
        <a th:href="@{/admin/audit}" class="admin-nav-item" th:classappend="${active == 'audit'} ? 'active' : ''"
           sec:authorize="hasAnyRole('SUPER_ADMIN', 'ANALYST')">
          <span class="admin-nav-content">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
              <polyline points="10 9 9 9 8 9"/>
            </svg>
            <span>Audit log</span>
          </span>
        </a>

        <!-- 4. Staff Management (SUPER_ADMIN only) -->
        <a th:href="@{/admin/staff}" class="admin-nav-item" th:classappend="${active == 'staff'} ? 'active' : ''"
           sec:authorize="hasRole('SUPER_ADMIN')">
          <span class="admin-nav-content">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M12 2a5 5 0 0 1 5 5v2a5 5 0 0 1-10 0V7a5 5 0 0 1 5-5z"/>
              <path d="M19 21v-2a6 6 0 0 0-12 0v2"/>
            </svg>
            <span>Staff</span>
          </span>
        </a>

        <div class="admin-nav-divider"></div>

        <!-- External link to User Portal -->
        <a th:href="@{/app/dashboard}" class="admin-nav-link-ext" target="_blank" rel="noopener">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/>
            <line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
          <span>View family app</span>
        </a>
      </nav>

      <!-- User Pill at Bottom -->
      <div class="admin-sidebar-footer">
        <div class="admin-user-pill">
          <div class="admin-avatar" th:text="${adminInitials != null ? adminInitials : 'AD'}">AD</div>
          <div class="admin-user-info">
            <div class="admin-user-name" th:text="${adminName != null ? adminName : 'Administrator'}">Administrator</div>
            <div class="admin-user-role-badge" th:text="${adminRole != null ? adminRole : 'STAFF'}">SUPER_ADMIN</div>
          </div>
        </div>

        <div class="admin-footer-actions">
          <!-- Theme toggle button -->
          <button type="button" class="btn-sidebar-icon theme-toggle-btn" data-theme-toggle aria-label="Switch between light and dark mode" title="Toggle theme">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>


          <!-- Logout Form -->
          <form th:action="@{/logout}" method="post" style="display: inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>
            <button type="submit" class="btn-sidebar-icon" aria-label="Sign out" title="Sign out">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
            </button>
          </form>
        </div>
      </div>
    </aside>

    <!-- Main View Content Area -->
    <div class="admin-main">
      <!-- Sticky Topbar (Glass) -->
      <header class="admin-topbar" aria-label="Admin Topbar">
        <div class="admin-topbar-left">
          <h1 class="admin-page-title" th:text="${title != null ? title : 'Administration'}">Administration</h1>

          <!-- Search form: navigates to /admin/users?q=... -->
          <form th:action="@{/admin/users}" method="get" class="admin-search-form" role="search">
            <svg class="admin-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="search" name="q" class="admin-search-input" placeholder="Search users by name or email..." aria-label="Search users">
          </form>
        </div>

        <div class="admin-topbar-right">
          <!-- Range Switcher (7d / 30d / 90d, active only on dashboard) -->
          <div class="range-switcher" th:if="${dashboard != null}">
            <a th:href="@{/admin/dashboard(range=7)}" class="range-btn" th:classappend="${dashboard.selectedRange == 7} ? 'active' : ''">7d</a>
            <a th:href="@{/admin/dashboard(range=30)}" class="range-btn" th:classappend="${dashboard.selectedRange == 30} ? 'active' : ''">30d</a>
            <a th:href="@{/admin/dashboard(range=90)}" class="range-btn" th:classappend="${dashboard.selectedRange == 90} ? 'active' : ''">90d</a>
          </div>

          <!-- System Status Pill -->
          <div class="system-status-pill" th:classappend="${dashboard != null && !dashboard.systemHealthy} ? 'degraded' : ''">
            <span class="status-dot"></span>
            <span th:text="${dashboard != null ? dashboard.systemStatusLabel : 'System healthy'}">System healthy</span>
          </div>

          <!-- Topbar Theme Switcher -->
          <button type="button" class="btn-sm" data-theme-toggle aria-label="Switch between light and dark mode" title="Toggle theme" style="display: inline-flex; align-items: center; gap: 6px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/>
              <line x1="12" y1="21" x2="12" y2="23"/>
            </svg>
            <span>Theme</span>
          </button>
        </div>

      </header>

      <!-- Main Landmark Body Container -->
      <main id="main-content" class="admin-content" role="main">
        <!-- Content injected here -->
        <th:block th:replace="${content}" />
      </main>
    </div>
  </div>

  <!-- Shared Status Change Modal Dialog -->
  <div id="status-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="status-modal-title" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 id="status-modal-title" class="modal-title">Change user status</h2>
        <button type="button" class="modal-close-btn btn-close-modal" aria-label="Close dialog">&times;</button>
      </div>
      <form id="status-modal-form" method="post" action="">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>
        <input type="hidden" id="status-modal-action" name="action" value="SUSPEND"/>
        <div class="modal-body">
          <p id="status-modal-desc" style="color: var(--muted); font-size: 0.88rem; margin: 0;">
            Please provide a specific justification for this account status modification.
          </p>
          <label for="status-reason-input" style="font-weight: 600; font-size: 0.8rem; color: var(--heading);">
            Reason for status change (required, minimum 5 characters):
          </label>
          <textarea id="status-reason-input" name="reason" rows="3" class="form-input" style="height: auto; resize: vertical;"
                    placeholder="Enter explicit administrative justification..." required minlength="5"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-sm btn-close-modal">Cancel</button>
          <button type="submit" id="status-modal-confirm-btn" class="btn-sm btn-sm-danger">Confirm</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Application Scripts -->
  <script th:src="@{/js/theme.js}"></script>
  <script th:src="@{/js/admin.js}"></script>
</body>
</html>
