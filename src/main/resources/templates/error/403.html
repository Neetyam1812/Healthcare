<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 - Access Denied | FamilyCare</title>
  <link rel="stylesheet" th:href="@{/css/theme.css}">
  <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-viewport" style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
  <div style="background: var(--auth-card-bg, #ffffff); border: 1px solid var(--auth-border, rgba(0,0,0,0.08)); padding: 48px 36px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; max-width: 460px; width: 90%;">
    <div style="width: 64px; height: 64px; border-radius: 50%; background: rgba(239, 68, 68, 0.12); color: #EF4444; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 20px;">
      <svg style="width: 32px; height: 32px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
      </svg>
    </div>
    <h1 style="color: var(--auth-heading, #0f172a); font-size: 1.75rem; margin-bottom: 8px;">403 - Access Denied</h1>
    <p style="color: var(--auth-body, #475569); margin-bottom: 28px; line-height: 1.5;">
      You do not have permission to access this administrative resource.
    </p>
    <a th:href="@{/}" class="auth-submit-btn" style="text-decoration: none; display: inline-flex; width: auto; padding: 12px 28px; margin: 0 auto;">
      <span>Back to home</span>
    </a>
  </div>
</body>
</html>
